<svg width="960" height="360" viewBox="0 0 960 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .star1 { animation: twinkle 2.4s infinite ease-in-out alternate; }
    .star2 { animation: twinkle 1.8s infinite ease-in-out alternate 0.7s; }
    .star3 { animation: twinkle 3.1s infinite ease-in-out alternate 1.3s; }
    @keyframes twinkle {
      0% { opacity: 0.25; }
      100% { opacity: 1; }
    }
  </style>
  <defs>
    <clipPath id="bannerClip">
      <rect width="960" height="360" rx="14" />
    </clipPath>
  </defs>
  <g clip-path="url(#bannerClip)">
    <image width="960" height="360" preserveAspectRatio="xMidYMid slice" style="image-rendering: pixelated;" href="data:image/jpeg;base64," />

    <!-- Animated Pixel Stars Overlay -->
    <g fill="#E2F1FF" shape-rendering="crispEdges">
      <rect x="210" y="30" width="4" height="4" class="star1" />
      <rect x="354" y="21" width="6" height="6" class="star2" />
      <rect x="615" y="27" width="4" height="4" class="star3" />
      <rect x="744" y="42" width="6" height="6" class="star1" />
      <rect x="831" y="24" width="4" height="4" class="star2" />
      <rect x="315" y="54" width="4" height="4" class="star3" />
    </g>

    <rect width="960" height="360" rx="14" fill="none" stroke="#30363d" stroke-width="2" />
  </g>
</svg>
