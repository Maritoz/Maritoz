<svg width="420" height="104" viewBox="0 0 420 104" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    .bg { fill: #121212; stroke: #282828; stroke-width: 1.5; }
    .title { font: 600 10.5px 'Segoe UI', Ubuntu, Sans-Serif; fill: #1DB954; letter-spacing: 0.8px; text-transform: uppercase; }
    .song { font: 700 13.5px 'Segoe UI', Ubuntu, Sans-Serif; fill: #FFFFFF; }
    .artist { font: 400 12.5px 'Segoe UI', Ubuntu, Sans-Serif; fill: #B3B3B3; }
    .bar { fill: #1DB954; rx: 1.5px; }
    .bar1 { animation: pulse 0.9s infinite ease-in-out alternate; }
    .bar2 { animation: pulse 0.6s infinite ease-in-out alternate 0.2s; }
    .bar3 { animation: pulse 0.75s infinite ease-in-out alternate 0.4s; }
    .bar4 { animation: pulse 0.55s infinite ease-in-out alternate 0.1s; }
    @keyframes pulse {
      0% { height: 4px; y: 78px; }
      100% { height: 18px; y: 64px; }
    }
  </style>

  <defs>
    <clipPath id="albumClip">
      <rect x="16" y="16" width="72" height="72" rx="8" />
    </clipPath>
  </defs>

  <!-- Card Background -->
  <rect x="1" y="1" width="418" height="102" rx="12" class="bg"/>

  <!-- Album Cover: Soda Stereo - Sueño Stereo -->
  <image x="16" y="16" width="72" height="72" clip-path="url(#albumClip)" preserveAspectRatio="xMidYMid slice" href="data:image/jpeg;base64," />
  <rect x="16" y="16" width="72" height="72" rx="8" fill="none" stroke="#333333" stroke-width="1"/>

  <!-- Spotify Icon + Header -->
  <g transform="translate(104, 23)">
    <circle cx="7" cy="7" r="7" fill="#1DB954"/>
    <path d="M10.2 6.2C8.1 5.3 4.8 5.2 3.1 5.7C2.8 5.8 2.5 5.6 2.4 5.3C2.3 5 2.5 4.7 2.8 4.6C4.8 4 8.4 4.1 10.8 5.2C11.1 5.3 11.2 5.7 11 6C10.9 6.2 10.5 6.3 10.2 6.2ZM9.8 8.3C9.6 8.5 9.3 8.6 9.1 8.4C7.4 7.4 4.9 7.1 3.3 7.6C3 7.7 2.7 7.5 2.6 7.2C2.5 6.9 2.7 6.6 3 6.5C4.9 5.9 7.7 6.2 9.6 7.4C9.9 7.6 10 7.9 9.8 8.3ZM8.9 10.3C8.8 10.5 8.5 10.6 8.3 10.4C6.9 9.5 5.1 9.3 3.4 9.7C3.2 9.8 2.9 9.6 2.9 9.4C2.8 9.2 3 8.9 3.2 8.9C5.1 8.4 7.1 8.7 8.7 9.7C9 9.8 9 10.1 8.9 10.3Z" fill="#121212"/>
    <text x="20" y="11" class="title">Spotify • Canción favorita</text>
  </g>

  <!-- Track & Artist -->
  <text x="104" y="56" class="song">Ella Usó Mi Cabeza Como un Revólver</text>
  <text x="104" y="76" class="artist">Soda Stereo • Sueño Stereo</text>

  <!-- Animated Equalizer Bars -->
  <rect x="374" y="64" width="3.5" height="18" class="bar bar1"/>
  <rect x="381" y="68" width="3.5" height="14" class="bar bar2"/>
  <rect x="388" y="62" width="3.5" height="20" class="bar bar3"/>
  <rect x="395" y="70" width="3.5" height="12" class="bar bar4"/>
</svg>
